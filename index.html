<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Comenzi Portrete</title>
  
  <!-- Font: Oswald & FontAwesome for Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    /* --- THEME: Electric Cyan & Deep Space Blue --- */
    :root {
      --bg-dark: #030712;       /* Deep space black/blue */
      --primary: #00f2fe;       /* Electric Cyan */
      --primary-dim: rgba(0, 242, 254, 0.4); 
      --text-main: #ffffff;
    }

    * { box-sizing: border-box; outline: none; margin: 0; padding: 0; }
    
    body {
      background-color: var(--bg-dark);
      font-family: 'Oswald', sans-serif; 
      color: var(--text-main);
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* --- FLOATING HEADER --- */
    .header-container {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      padding: 20px;
      z-index: 1000;
      display: flex;
      justify-content: center;
    }

    header {
      width: 100%;
      max-width: 1200px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px 10px 30px;
      background: rgba(3, 7, 18, 0.6);
      border: 1px solid rgba(0, 242, 254, 0.2);
      border-radius: 100px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    /* Logo Image */
    .logo img {
      height: 40px;
      vertical-align: middle;
    }

    /* --- AUTH CONTAINER (Inside Header) --- */
    .header-auth-box {
      display: flex;
      align-items: center;
    }

    .cyber-btn {
      background: rgba(0, 242, 254, 0.05);
      border: 1px solid var(--primary);
      color: var(--primary);
      padding: 8px 20px;
      font-family: 'Oswald', sans-serif;
      font-size: 14px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
      border-radius: 50px; /* Pill shape for buttons */
    }

    .cyber-btn:hover {
      background: var(--primary);
      color: #000;
      box-shadow: 0 0 15px var(--primary);
    }

    .logout-btn {
      border-color: #ff4757;
      color: #ff4757;
      background: transparent;
    }

    .logout-btn:hover {
      background: #ff4757;
      color: #fff;
      box-shadow: 0 0 15px rgba(255, 71, 87, 0.5);
    }

    .user-profile-ui {
      display: none; /* Hidden by default, shown via JS when logged in */
      align-items: center;
      gap: 15px;
    }

    .user-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 2px solid var(--primary);
      box-shadow: 0 0 10px var(--primary-dim);
      object-fit: cover;
    }

    /* --- GLOBAL BACKGROUND (3D GRID & NEBULA) --- */
    .cyber-page-section {
        position: relative;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center; /* Center everything perfectly */
        overflow: hidden;
    }

    .bg-grid-engine {
        position: absolute;
        width: 200%; height: 200%;
        top: -50%; left: -50%;
        background-image: 
            linear-gradient(rgba(0, 242, 254, 0.1) 1px, transparent 1px),
            linear-gradient(90deg, rgba(0, 242, 254, 0.1) 1px, transparent 1px);
        background-size: 60px 60px;
        transform: perspective(600px) rotateX(55deg);
        animation: gridSlowScroll 20s linear infinite;
        mask-image: radial-gradient(circle at center, black 20%, transparent 80%);
        -webkit-mask-image: radial-gradient(circle at center, black 20%, transparent 80%);
        z-index: 0;
        pointer-events: none;
    }

    .bg-nebula {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 50%, rgba(0, 119, 255, 0.15) 0%, transparent 60%);
        filter: blur(80px);
        z-index: 0;
        pointer-events: none;
    }

    @keyframes gridSlowScroll {
        from { background-position: 0 0; }
        to { background-position: 0 60px; }
    }

    /* --- CONTENT CONTAINER --- */
    .container {
        position: relative;
        z-index: 5;
        max-width: 1200px;
        width: 100%;
        padding: 20px;
        margin: 0 auto;
        text-align: center; /* Center the text inside */
    }

    /* --- TITLE STYLING (Solid Gradient + Glow) --- */
    .page-main-title {
        font-weight: 700;
        font-size: clamp(40px, 8vw, 85px);
        text-transform: uppercase;
        letter-spacing: 2px;
        margin-bottom: 10px; /* Reduced to pull welcome text closer */
        
        background: linear-gradient(180deg, #ffffff 0%, var(--primary) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        
        filter: drop-shadow(0 0 25px var(--primary-dim));
    }

    /* --- WELCOME TEXT & BADGES --- */
    .welcome-container {
        opacity: 0; /* Hidden until login */
        transition: opacity 0.5s ease;
        font-size: clamp(16px, 3vw, 24px);
        font-weight: 300;
        letter-spacing: 1px;
        color: #888;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        flex-wrap: wrap;
    }

    .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 12px;
        border-radius: 50px;
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .badge-admin {
        background: rgba(255, 71, 87, 0.1);
        border: 1px solid #ff4757;
        color: #ff4757;
        box-shadow: 0 0 15px rgba(255, 71, 87, 0.4);
    }

    .badge-user {
        background: rgba(0, 242, 254, 0.1);
        border: 1px solid var(--primary);
        color: var(--primary);
        box-shadow: 0 0 15px var(--primary-dim);
    }

  </style>
</head>
<body>

    <!-- HEADER (Logo + Auth) -->
    <div class="header-container">
        <header>
            <!-- KSDA Logo -->
            <a href="#" class="logo">
                <img src="https://iili.io/fXvBEiB.png" alt="KSDA Logo">
            </a>

            <!-- Auth UI -->
            <div class="header-auth-box">
                <!-- Login Button -->
                <button id="googleLoginBtn" class="cyber-btn">
                    <i class="fab fa-google"></i> LOGIN
                </button>

                <!-- Logged In UI (Hidden initially) -->
                <div id="userProfileUI" class="user-profile-ui">
                    <img id="userAvatarImg" src="" alt="Avatar" class="user-avatar">
                    <button id="logoutBtn" class="cyber-btn logout-btn">
                        LOGOUT
                    </button>
                </div>
            </div>
        </header>
    </div>

    <!-- MAIN PAGE -->
    <main class="cyber-page-section">
        
        <!-- Animated Background Engine -->
        <div class="bg-grid-engine"></div>
        <div class="bg-nebula"></div>

        <div class="container">
            <!-- Title -->
            <h1 class="page-main-title">Comenzi Portrete</h1>
            
            <!-- Dynamic Welcome Text (Shows up when logged in) -->
            <div id="welcomeContainer" class="welcome-container">
                <!-- Javascript will inject "BINE AI VENIT, [NUME] [BADGE]" here -->
            </div>

            <!-- ADD YOUR NEW CONTENT / PORTRAIT SYSTEM HERE LATER -->
        </div>

    </main>

    <!-- ==========================================
         FIREBASE INITIALIZATION & AUTH LOGIC
    ========================================== -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
      import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

      // Firebase Config
      const firebaseConfig = {
        apiKey: "AIzaSyDoH80kffNrzFAcyRqsTVdifs-whUhwH9A",
        authDomain: "ksda-7546f.firebaseapp.com",
        projectId: "ksda-7546f",
        storageBucket: "ksda-7546f.firebasestorage.app",
        messagingSenderId: "306437513808",
        appId: "1:306437513808:web:28479810e3fdf71b32e755"
      };

      // Initialize Firebase
      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);
      const provider = new GoogleAuthProvider();

      // Expose globally
      window.auth = auth;
      window.db = db;

      // DOM Elements
      const loginBtn = document.getElementById('googleLoginBtn');
      const logoutBtn = document.getElementById('logoutBtn');
      const userProfileUI = document.getElementById('userProfileUI');
      const userAvatarImg = document.getElementById('userAvatarImg');
      const welcomeContainer = document.getElementById('welcomeContainer');

      // 1. Google Login
      loginBtn.addEventListener('click', async () => {
          try {
              await signInWithPopup(auth, provider);
          } catch (error) {
              console.error("Login Error:", error);
          }
      });

      // 2. Logout
      logoutBtn.addEventListener('click', () => {
          signOut(auth);
      });

      // 3. Monitor Auth State & Check Admin Collection
      onAuthStateChanged(auth, async (user) => {
          if (user) {
              
              // Show Logged-In UI in header
              loginBtn.style.display = 'none';
              userProfileUI.style.display = 'flex';
              userAvatarImg.src = user.photoURL || 'https://i.ibb.co/4pGm9S2/user-placeholder.png';

              // --- CHECK ADMIN STATUS ---
              // Search the "admin_emails" collection for this user's email
              const adminQuery = query(collection(db, "admin_emails"), where("email", "==", user.email));
              const adminSnapshot = await getDocs(adminQuery);

              // If snapshot is NOT empty, they are an admin
              const isAdmin = !adminSnapshot.empty;

              // Build the Badge HTML based on role
              let badgeHtml = "";
              if (isAdmin) {
                  badgeHtml = `<span class="badge badge-admin"><i class="fas fa-hammer"></i> ADMIN</span>`;
              } else {
                  badgeHtml = `<span class="badge badge-user"><i class="fas fa-user"></i> MEMBRU</span>`;
              }

              // Update the welcome container below the title
              welcomeContainer.innerHTML = `BINE AI VENIT, <span style="color: #fff; font-weight: 700;">${user.displayName}</span> ${badgeHtml}`;
              welcomeContainer.style.opacity = '1';

          } else {
              // User is signed out
              loginBtn.style.display = 'flex';
              userProfileUI.style.display = 'none';
              
              // Hide the welcome text
              welcomeContainer.style.opacity = '0';
              setTimeout(() => { welcomeContainer.innerHTML = ''; }, 500); // Clear after fade out
          }
      });

    </script>
</body>
</html>
