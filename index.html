<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Blank Canvas</title>
  
  <!-- New Font: Oswald -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">
  
  <style>
    /* --- NEW THEME: Electric Cyan & Deep Space Blue --- */
    :root {
      --bg-dark: #030712;       /* Deep space black/blue */
      --primary: #00f2fe;       /* Electric Cyan */
      --primary-dim: rgba(0, 242, 254, 0.15);
      --accent: #4facfe;        /* Deep Blue Accent */
      --text-main: #ffffff;
      --transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    * { box-sizing: border-box; outline: none; margin: 0; padding: 0; }
    
    body {
      background-color: var(--bg-dark);
      /* Applied Oswald globally */
      font-family: 'Oswald', sans-serif; 
      color: var(--text-main);
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* --- GLOBAL BACKGROUND (3D GRID & NEBULA) --- */
    .cyber-page-section {
        position: relative;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }

    /* The moving 3D Floor */
    .bg-grid-engine {
        position: absolute;
        width: 200%; height: 200%;
        top: -50%; left: -50%;
        background-image: 
            linear-gradient(var(--primary-dim) 1px, transparent 1px),
            linear-gradient(90deg, var(--primary-dim) 1px, transparent 1px);
        background-size: 60px 60px;
        transform: perspective(600px) rotateX(55deg);
        animation: gridSlowScroll 20s linear infinite;
        mask-image: radial-gradient(circle at center, black 20%, transparent 80%);
        -webkit-mask-image: radial-gradient(circle at center, black 20%, transparent 80%);
        z-index: 0;
        pointer-events: none;
    }

    /* The glowing atmosphere */
    .bg-nebula {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 50%, rgba(0, 119, 255, 0.15) 0%, transparent 60%);
        filter: blur(80px);
        z-index: 0;
        pointer-events: none;
    }

    @keyframes gridSlowScroll {
        from { background-position: 0 0; }
        to { background-position: 0 60px; }
    }

    /* --- CONTENT CONTAINER --- */
    .container {
        position: relative;
        z-index: 5;
        max-width: 1200px;
        width: 100%;
        padding: 20px;
        margin: 0 auto;
    }

    /* --- TITLE STYLING (With the new Oswald font) --- */
    .page-main-title {
        font-family: 'Oswald', sans-serif;
        font-weight: 700;
        font-size: clamp(40px, 8vw, 90px);
        text-transform: uppercase;
        text-align: center;
        letter-spacing: 2px;
        
        /* Hollow text effect */
        color: transparent;
        -webkit-text-stroke: 1.5px rgba(255, 255, 255, 0.3);
    }
    
    .page-main-title span {
        color: var(--primary);
        -webkit-text-stroke: 0px;
        text-shadow: 0 0 35px var(--primary);
    }

  </style>
</head>
<body>

    <!-- EMPTY PAGE WITH ANIMATED BACKGROUND -->
    <main class="cyber-page-section">
        
        <!-- Animated Background Engine -->
        <div class="bg-grid-engine"></div>
        <div class="bg-nebula"></div>

        <div class="container">
            <!-- Example of the Oswald font & New Colors. You can delete this text! -->
            <h1 class="page-main-title"><span>BLANK</span> CANVAS</h1>
            
            <!-- ADD YOUR NEW CONTENT HERE -->

        </div>

    </main>

</body>
</html>
