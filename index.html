
<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Comenzi Portrete</title>
  
  <!-- Font: Oswald & FontAwesome for Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    /* --- THEME: Electric Cyan, Deep Space Blue & Admin Red --- */
    :root {
      --bg-dark: #030712;
      --primary: #00f2fe;
      --primary-dim: rgba(0, 242, 254, 0.4); 
      --admin-red: #ff4757;
      --admin-red-dim: rgba(255, 71, 87, 0.4);
      --text-main: #ffffff;
      --glass-bg: rgba(13, 25, 41, 0.7);
      --glass-border: rgba(255, 255, 255, 0.1);
    }

    * { box-sizing: border-box; outline: none; margin: 0; padding: 0; }
    
    body {
      background-color: var(--bg-dark);
      font-family: 'Oswald', sans-serif; 
      color: var(--text-main);
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* --- FLOATING HEADER --- */
    .header-container {
      position: fixed; top: 0; left: 0; right: 0; padding: 20px;
      z-index: 1000; display: flex; justify-content: center;
    }

    header {
      width: 100%; max-width: 1200px; display: flex; align-items: center;
      justify-content: space-between; padding: 10px 20px 10px 30px;
      background: rgba(3, 7, 18, 0.6); border: 1px solid rgba(0, 242, 254, 0.2);
      border-radius: 100px; backdrop-filter: blur(16px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .logo img { height: 40px; vertical-align: middle; }

    /* --- AUTH CONTAINER --- */
    .header-auth-box { display: flex; align-items: center; }

    .cyber-btn {
      background: rgba(0, 242, 254, 0.05); border: 1px solid var(--primary);
      color: var(--primary); padding: 8px 20px; font-family: 'Oswald', sans-serif;
      font-size: 14px; font-weight: 500; text-transform: uppercase;
      letter-spacing: 1px; cursor: pointer; transition: all 0.3s ease;
      display: flex; align-items: center; gap: 8px; border-radius: 50px;
    }

    .cyber-btn:hover { background: var(--primary); color: #000; box-shadow: 0 0 15px var(--primary); }

    .logout-btn { border-color: var(--admin-red); color: var(--admin-red); background: transparent; }
    .logout-btn:hover { background: var(--admin-red); color: #fff; box-shadow: 0 0 15px var(--admin-red-dim); }

    .user-profile-ui { display: none; align-items: center; gap: 15px; }
    .user-avatar { width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--primary); box-shadow: 0 0 10px var(--primary-dim); object-fit: cover; }

    /* --- GLOBAL BACKGROUND --- */
    .cyber-page-section {
        position: relative; min-height: 100vh; display: flex; flex-direction: column;
        align-items: center; justify-content: flex-start; padding-top: 120px; overflow: hidden;
    }

    .bg-grid-engine {
        position: absolute; width: 200%; height: 200%; top: -50%; left: -50%;
        background-image: linear-gradient(rgba(0, 242, 254, 0.1) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 242, 254, 0.1) 1px, transparent 1px);
        background-size: 60px 60px; transform: perspective(600px) rotateX(55deg);
        animation: gridSlowScroll 20s linear infinite;
        mask-image: radial-gradient(circle at center, black 20%, transparent 80%);
        z-index: 0; pointer-events: none;
    }

    .bg-nebula {
        position: absolute; inset: 0;
        background: radial-gradient(circle at 50% 50%, rgba(0, 119, 255, 0.15) 0%, transparent 60%);
        filter: blur(80px); z-index: 0; pointer-events: none;
    }

    @keyframes gridSlowScroll { from { background-position: 0 0; } to { background-position: 0 60px; } }

    /* --- CONTENT CONTAINER --- */
    .container { position: relative; z-index: 5; max-width: 1200px; width: 100%; padding: 20px; margin: 0 auto; text-align: center; }

    .page-main-title {
        font-weight: 700; font-size: clamp(40px, 8vw, 85px); text-transform: uppercase;
        letter-spacing: 2px; margin-bottom: 10px;
        background: linear-gradient(180deg, #ffffff 0%, var(--primary) 100%);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 0 25px var(--primary-dim));
    }

    /* --- WELCOME TEXT & BADGES --- */
    .welcome-container {
        opacity: 0; transition: opacity 0.5s ease; font-size: clamp(18px, 3vw, 24px);
        font-weight: 600; letter-spacing: 1px; color: #ffffff; text-transform: uppercase;
        display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap;
    }

    .badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 50px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
    .badge-admin { background: rgba(255, 71, 87, 0.1); border: 1px solid var(--admin-red); color: var(--admin-red); box-shadow: 0 0 15px var(--admin-red-dim); }
    .badge-user { background: rgba(0, 242, 254, 0.1); border: 1px solid var(--primary); color: var(--primary); box-shadow: 0 0 15px var(--primary-dim); }

    /* --- ADMIN ACTION BAR --- */
    .admin-action-bar {
        display: none;
        margin-top: 30px;
        justify-content: center;
    }

    .btn-admin-add {
        background: rgba(255, 71, 87, 0.1); border: 2px solid var(--admin-red);
        color: #fff; padding: 12px 30px; font-family: 'Oswald', sans-serif;
        font-size: 16px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px;
        border-radius: 50px; cursor: pointer; display: flex; align-items: center;
        gap: 10px; transition: all 0.3s ease; box-shadow: 0 0 20px var(--admin-red-dim);
    }
    .btn-admin-add:hover {
        background: var(--admin-red); color: #fff; transform: translateY(-3px); box-shadow: 0 0 30px var(--admin-red);
    }

    /* --- ORDERS GRID --- */
    .orders-grid {
        display: none; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 30px; margin-top: 50px; padding-bottom: 50px;
    }

    .order-card {
        background: var(--glass-bg); border: 1px solid var(--glass-border);
        border-radius: 16px; overflow: hidden; cursor: pointer;
        transition: all 0.3s ease; position: relative; backdrop-filter: blur(10px);
    }

    .order-card:hover { transform: translateY(-10px); border-color: var(--primary); box-shadow: 0 10px 30px var(--primary-dim); }

    .order-img { width: 100%; height: 250px; object-fit: cover; border-bottom: 2px solid var(--primary); }

    .order-price-tag {
        position: absolute; top: 15px; right: 15px; background: rgba(0, 0, 0, 0.8);
        border: 1px solid #00ff88; color: #00ff88; padding: 5px 15px;
        border-radius: 50px; font-weight: 700; font-size: 16px; box-shadow: 0 0 15px rgba(0, 255, 136, 0.4);
    }

    /* --- MODALS (POPUPS) - REVAMPED SPICY DESIGN --- */
    .custom-modal-overlay {
        position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(15px);
        display: none; justify-content: center; align-items: center; z-index: 2000; padding: 20px;
    }
    .custom-modal-overlay.active { display: flex; }

    /* Fixing the scrollbar issue by separating header and body */
    .custom-modal-card {
        background: rgba(8, 16, 27, 0.95);
        backdrop-filter: blur(35px);
        border: 1px solid var(--primary);
        border-top: 4px solid var(--primary);
        width: 100%; max-width: 850px;
        border-radius: 24px;
        position: relative; 
        box-shadow: 0 0 50px rgba(0, 242, 254, 0.2), inset 0 0 30px rgba(0, 242, 254, 0.1);
        display: flex; flex-direction: column; overflow: hidden; /* Contains the scrollbar */
    }

    .modal-header-container { padding: 30px 40px 10px 40px; position: relative; z-index: 5; }
    
    .modal-body-container { 
        padding: 10px 40px 40px 40px; 
        overflow-y: auto; 
        max-height: calc(90vh - 110px); 
    }

    /* Custom Scrollbar */
    .modal-body-container::-webkit-scrollbar { width: 8px; }
    .modal-body-container::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; box-shadow: 0 0 10px var(--primary); }
    .modal-body-container::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); }

    .close-modal-btn {
        position: absolute; top: 25px; right: 25px;
        background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
        color: #fff; width: 35px; height: 35px; border-radius: 50%;
        font-size: 16px; cursor: pointer; transition: 0.3s;
        display: flex; align-items: center; justify-content: center; z-index: 10;
    }
    .close-modal-btn:hover { background: var(--admin-red); border-color: var(--admin-red); transform: rotate(90deg); box-shadow: 0 0 15px var(--admin-red); }

    .modal-title {
        font-size: 28px; color: #fff; text-transform: uppercase; letter-spacing: 3px;
        margin-bottom: 20px; border-bottom: 1px solid rgba(0, 242, 254, 0.2); padding-bottom: 15px;
        text-align: center; text-shadow: 0 0 20px var(--primary-dim);
    }
    .modal-title i { color: var(--primary); margin-right: 10px; }

    /* --- FORM GRIDS --- */
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    
    .grid-3-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; grid-column: 1 / -1; }
    .grid-5-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; grid-column: 1 / -1; }
    
    @media (max-width: 768px) { 
        .form-grid, .grid-3-row { grid-template-columns: 1fr; } 
        .grid-5-row { grid-template-columns: 1fr 1fr; }
    }

    .form-section-title {
        grid-column: 1 / -1; font-size: 16px; color: #aaa; text-transform: uppercase;
        letter-spacing: 1px; margin-top: 15px; border-left: 3px solid var(--primary); padding-left: 10px;
    }

    .input-group { position: relative; display: flex; flex-direction: column; text-align: left; }
    .input-group label { font-size: 12px; color: var(--primary); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
    
    .input-wrapper { position: relative; }

    /* --- IMAGE DROP AREA --- */
    .image-drop-area {
        grid-column: 1 / -1;
        height: 280px;
        border: 2px dashed var(--primary);
        border-radius: 16px;
        display: flex; align-items: center; justify-content: center; flex-direction: column;
        position: relative; cursor: pointer; overflow: hidden;
        background: rgba(0, 242, 254, 0.05);
        transition: all 0.3s;
        box-shadow: inset 0 0 20px rgba(0, 242, 254, 0.1);
        margin-bottom: 10px;
    }
    .image-drop-area:hover { background: rgba(0, 242, 254, 0.1); box-shadow: inset 0 0 30px rgba(0, 242, 254, 0.3); }
    .image-drop-area input[type="file"] { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; z-index: 5; }
    
    .image-drop-placeholder { text-align: center; color: var(--primary); pointer-events: none; }
    .image-drop-placeholder i { font-size: 50px; margin-bottom: 15px; text-shadow: 0 0 20px var(--primary); }
    .image-drop-placeholder span { font-size: 18px; font-weight: bold; letter-spacing: 2px; display: block; text-transform: uppercase; }
    
    .image-drop-preview {
        position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain;
        display: none; z-index: 2; background: #000;
    }
    
    .image-remove-btn {
        position: absolute; top: 15px; right: 15px; background: var(--admin-red); color: white;
        border: none; border-radius: 50%; width: 40px; height: 40px; font-size: 18px;
        cursor: pointer; z-index: 10; display: none; align-items: center; justify-content: center;
        box-shadow: 0 0 20px var(--admin-red); transition: 0.3s;
    }
    .image-remove-btn:hover { transform: scale(1.15) rotate(90deg); }

    /* --- PERMANENT LIGHT UP INPUTS --- */
    .styled-input {
        width: 100%; 
        background: rgba(0, 242, 254, 0.08); /* Permanent glowing background tint */
        border: 1px solid var(--primary); /* Permanent primary border */
        color: #fff; font-family: 'Oswald', sans-serif; font-size: 15px;
        padding: 14px 14px 14px 45px; border-radius: 50px; 
        transition: all 0.3s ease; 
        box-shadow: 0 0 15px var(--primary-dim), inset 0 2px 5px rgba(0,0,0,0.5); /* Permanent Glow Box Shadow */
    }
    .styled-input:focus {
        background: rgba(0, 242, 254, 0.15);
        box-shadow: 0 0 25px var(--primary), inset 0 2px 10px rgba(0,0,0,0.5);
    }
    
    /* Icons permanently lit up */
    .input-wrapper i {
        position: absolute; left: 18px; top: 50%; transform: translateY(-50%);
        color: var(--primary); /* Permanent cyan */
        text-shadow: 0 0 15px var(--primary); /* Permanent glow */
        font-size: 16px; transition: all 0.3s ease; pointer-events: none;
    }

    /* Small inputs for the 5-row and 3-row elements */
    .compact-input { padding: 12px 12px 12px 35px; font-size: 13px; }
    .grid-5-row .input-wrapper i { left: 13px; font-size: 13px; }

    /* File Upload Input */
    input[type="file"].styled-input { padding: 9px 10px 9px 40px; font-size: 13px; cursor: pointer; }
    input[type="file"]::file-selector-button {
        background: var(--primary); color: #000; border: none; padding: 5px 12px;
        border-radius: 50px; font-family: 'Oswald', sans-serif; font-weight: bold;
        cursor: pointer; margin-right: 10px; transition: 0.3s;
    }
    input[type="file"]::file-selector-button:hover { background: #fff; box-shadow: 0 0 15px var(--primary); }

    /* Button Salvare */
    .btn-submit-order {
        grid-column: 1 / -1;
        background: var(--primary); color: #000; border: none; padding: 18px;
        font-family: 'Oswald', sans-serif; font-size: 20px; font-weight: 700;
        text-transform: uppercase; letter-spacing: 3px; border-radius: 50px;
        cursor: pointer; transition: 0.3s; margin-top: 10px; 
        box-shadow: 0 0 30px var(--primary-dim);
    }
    .btn-submit-order:hover { background: #fff; box-shadow: 0 0 40px var(--primary); transform: translateY(-3px); }
    .btn-submit-order:disabled { background: #555; box-shadow: none; cursor: not-allowed; transform: none; }

    /* Order Details Modal */
    .details-value { 
        background: rgba(0, 242, 254, 0.08); padding: 14px 14px 14px 45px; border-radius: 50px; 
        color: #fff; font-size: 15px; border: 1px solid var(--primary); word-wrap: break-word;
        box-shadow: 0 0 15px var(--primary-dim), inset 0 2px 5px rgba(0,0,0,0.5);
    }
    .proof-link { color: #00ff88; text-decoration: none; font-weight: bold; text-shadow: 0 0 10px rgba(0,255,136,0.5); }
    .proof-link:hover { text-decoration: underline; }


.copy-btn {
        position: absolute;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
        background: rgba(0, 242, 254, 0.05);
        border: 1px solid rgba(0, 242, 254, 0.4);
        color: var(--primary);
        border-radius: 10px;
        width: 34px;
        height: 34px;
        
        /* THIS IS THE CENTERING MAGIC */
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        
        cursor: pointer;
        transition: all 0.2s ease;
        pointer-events: auto;
        z-index: 10;
        padding: 0; /* Ensures no internal shifting */
        margin: 0;
    }

    .copy-btn i {
        font-size: 14px;
        line-height: 0 !important; /* Removes the "text baseline" gap at the bottom */
        display: inline-block;
        margin: 0;
        padding: 0;
    }

    .copy-btn:hover {
        background: var(--primary);
        color: #000;
        box-shadow: 0 0 15px var(--primary-dim);
        transform: translateY(-50%) scale(1.05);
    }

    .copy-btn:active {
        transform: translateY(-50%) scale(0.9);
    }
    
    /* Small adjustment to make room for the button */
    .details-value { padding-right: 50px !important; }


/* CUSTOM NOTIFICATION SYSTEM */
    .cyber-toast {
        position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
        background: rgba(3, 7, 18, 0.95); border: 1px solid var(--primary);
        color: var(--primary); padding: 12px 30px; border-radius: 50px;
        font-family: 'Oswald', sans-serif; font-weight: 600; text-transform: uppercase;
        letter-spacing: 1px; z-index: 9999; backdrop-filter: blur(10px);
        box-shadow: 0 0 25px var(--primary-dim);
        animation: toastIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        pointer-events: none; display: flex; align-items: center; gap: 10px;
    }
    @keyframes toastIn { from { opacity: 0; bottom: 0; } to { opacity: 1; bottom: 30px; } }


/* --- STILURI NOI PENTRU CARDURI --- */
    .order-card {
        background: #000;
        border-radius: 20px;
        overflow: hidden;
        position: relative;
        display: flex;
        flex-direction: column;
        transition: all 0.3s ease;
        border: 2px solid transparent;
    }

    /* Glow-uri în funcție de status */
    .status-in-curs { border-color: #ffeb3b; box-shadow: 0 0 20px rgba(255, 235, 59, 0.3); }
    .status-livrat { border-color: #00ff88; box-shadow: 0 0 20px rgba(0, 255, 136, 0.3); }
    .status-anulat { border-color: #ff4757; box-shadow: 0 0 20px rgba(255, 71, 87, 0.3); }

    .order-img {
        width: 100%;
        height: 300px;
        object-fit: cover;
        display: block;
    }

    /* Butoane de control (Top Right) */
    .card-controls {
        position: absolute;
        top: 10px;
        right: 10px;
        display: flex;
        gap: 8px;
        z-index: 10;
    }

    .control-btn {
        width: 35px;
        height: 35px;
        border-radius: 50%;
        border: none;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-size: 14px;
        transition: 0.3s;
        backdrop-filter: blur(5px);
    }

    .edit-btn { background: rgba(0, 242, 254, 0.2); color: var(--primary); border: 1px solid var(--primary); }
    .edit-btn:hover { background: var(--primary); color: #000; }

    .delete-btn { background: rgba(255, 71, 87, 0.2); color: var(--admin-red); border: 1px solid var(--admin-red); }
    .delete-btn:hover { background: var(--admin-red); color: #fff; }

    /* Bara de jos (Price & Status) */
    .card-footer {
        background: var(--primary); /* Default cyan */
        padding: 15px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-radius: 20px 20px 0 0; /* Curbat sus conform imaginii */
        margin-top: -20px; /* Suprapunere peste imagine */
        position: relative;
        z-index: 5;
        color: #000;
        font-weight: 700;
    }

    .footer-price { font-size: 22px; }
    .footer-status { 
        font-size: 18px; 
        display: flex; 
        align-items: center; 
        gap: 5px; 
        text-transform: uppercase;
    }

    /* Culori footer bazate pe status */
    .bg-in-curs { background: #ffeb3b; box-shadow: 0 -5px 15px rgba(255, 235, 59, 0.4); }
    .bg-livrat { background: #00ff88; box-shadow: 0 -5px 15px rgba(0, 255, 136, 0.4); }
    .bg-anulat { background: #ff4757; box-shadow: 0 -5px 15px rgba(255, 71, 87, 0.4); }


/* --- CARD OVERRIDES --- */
    .order-card {
        background: #0b1120 !important;
        border-radius: 20px !important;
        overflow: visible !important; /* Allow status menu to pop out */
        border: 2px solid transparent !important;
    }

    /* Neon Outlines */
    .status-in-curs { border-color: #ffeb3b !important; box-shadow: 0 0 15px rgba(255, 235, 59, 0.2) !important; }
    .status-livrat { border-color: #00ff88 !important; box-shadow: 0 0 15px rgba(0, 255, 136, 0.2) !important; }
    .status-anulat { border-color: #ff4757 !important; box-shadow: 0 0 15px rgba(255, 71, 87, 0.2) !important; }

    /* Moving Price back into the image area */
    .order-img { height: 280px !important; border-bottom: none !important; }
    
    .order-price-tag {
        top: auto !important;
        bottom: 70px !important;
        left: 15px !important;
        right: auto !important;
        z-index: 10 !important;
    }

    /* Dark Sleek Footer */
    .card-footer {
        background: #0b1120 !important;
        margin-top: 0 !important;
        padding: 15px !important;
        border-radius: 0 0 20px 20px !important;
        border-top: 1px solid rgba(255,255,255,0.05) !important;
        color: #fff !important;
    }

    .footer-status {
        background: rgba(255,255,255,0.05) !important;
        border: 1px solid rgba(255,255,255,0.1) !important;
        padding: 5px 12px !important;
        border-radius: 10px !important;
        cursor: pointer;
        font-size: 13px !important;
        color: #fff !important;
    }

    /* THE PICKER MENU */
    .status-menu {
        position: absolute;
        bottom: 60px;
        right: 15px;
        background: #16213e;
        border: 1px solid var(--primary);
        border-radius: 12px;
        display: none;
        flex-direction: column;
        z-index: 100;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        min-width: 130px;
        overflow: hidden;
    }
    .status-menu.active { display: flex; }
    
    .status-option {
        padding: 10px 15px;
        font-size: 13px;
        color: #fff;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 10px;
    }
    .status-option:hover { background: rgba(0, 242, 254, 0.1); }
    .opt-curs i { color: #ffeb3b; }
    .opt-livrat i { color: #00ff88; }
    .opt-anulat i { color: #ff4757; }


/* --- CARD DESIGN FINAL --- */
    .order-card {
        background: #0b1120 !important;
        border-radius: 20px !important;
        overflow: visible !important;
        border: 2px solid transparent !important;
        display: flex;
        flex-direction: column;
        transition: 0.3s ease;
    }

    /* Glow-uri Card */
    .status-in-curs { border-color: #ffeb3b !important; box-shadow: 0 0 15px rgba(255, 235, 59, 0.2) !important; }
    .status-livrat { border-color: #00ff88 !important; box-shadow: 0 0 15px rgba(0, 255, 136, 0.2) !important; }
    .status-anulat { border-color: #ff4757 !important; box-shadow: 0 0 15px rgba(255, 71, 87, 0.2) !important; }

    .order-img-container {
        height: 280px;
        overflow: hidden;
        border-radius: 18px 18px 0 0;
    }

    .order-img { width: 100%; height: 100%; object-fit: cover; cursor: pointer; }

    /* FOOTER: TOATE PE UN SINGUR RÂND */
    .card-footer {
        background: #0b1120 !important;
        padding: 12px 18px !important;

document.getElementById('addOrderForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!globalIsAdmin) return notify("Acces restricționat!", true);

    const submitBtn = e.target.querySelector('.btn-submit-order');
    const originalText = submitBtn.innerHTML;
    submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> SE PROCESEAZĂ...';
    submitBtn.disabled = true;

    try {
        let finalImageUrl = null;
        let finalProofUrl = null;

        // Dacă suntem în modul EDITARE, luăm link-urile vechi ca bază
        if (editingOrderId) {
            const oldOrder = currentOrders.find(o => o.id === editingOrderId);
            finalImageUrl = oldOrder.imageUrl;
            finalProofUrl = oldOrder.paymentProof;
        }

        const imageFile = document.getElementById('oImageFile').files[0];
        const proofFile = document.getElementById('oProofFile').files[0];

        // Încărcăm poze noi DOAR dacă au fost selectate fișiere
        if (imageFile) {
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> ÎNCĂRCARE PORTRET...';
            finalImageUrl = await uploadToImgBB(imageFile);
        }
        if (proofFile) {
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> ÎNCĂRCARE DOVADĂ...';
            finalProofUrl = await uploadToImgBB(proofFile);
        }

        // Construim string-ul pentru bloc/adresă
        const bl = document.getElementById('oBl').value.trim();
        const sc = document.getElementById('oSc').value.trim();
        const inter = document.getElementById('oInterfon').value.trim();
        const et = document.getElementById('oEt').value.trim();
        const ap = document.getElementById('oAp').value.trim();
        let bParts = [];
        if(bl) bParts.push(`Bl. ${bl}`);
        if(sc) bParts.push(`Sc. ${sc}`);
        if(inter) bParts.push(`Int. ${inter}`);
        if(et) bParts.push(`Et. ${et}`);
        if(ap) bParts.push(`Ap. ${ap}`);
        const finalBuilding = bParts.length > 0 ? bParts.join(', ') : "La casă";

        // Obiectul cu toate datele din formular
        const orderData = {
            imageUrl: finalImageUrl,
            paymentProof: finalProofUrl,
            orderDate: document.getElementById('oDate').value,
    price: parseFloat(document.getElementById('oPrice').value),
    currency: document.getElementById('oCurrency').value, // SALVEAZĂ MONEDA
            name: document.getElementById('oName').value.trim(),
            phone: document.getElementById('oPhone').value.trim(),
            zipCode: document.getElementById('oZip').value.trim(),
            city: document.getElementById('oCity').value.trim(),
            county: document.getElementById('oCounty').value.trim(),
            street: document.getElementById('oStreet').value.trim(),
            building: finalBuilding,
            notes: document.getElementById('oNotes').value.trim()
        };

        if (editingOrderId) {
            // MOD EDITARE: Actualizăm documentul existent
            await updateDoc(doc(db, "comenzi", editingOrderId), orderData);
            notify("Comanda a fost actualizată cu succes!");
        } else {
            // MOD ADĂUGARE: Creăm un document nou
            orderData.status = "In Curs"; // Status default doar la comenzi noi
            orderData.createdAt = serverTimestamp();
            orderData.createdBy = auth.currentUser.email;
            await addDoc(collection(db, "comenzi"), orderData);
            notify("Comanda a fost adăugată!");
        }

        // RESETARE FORMULAR ȘI MODAL
        editingOrderId = null; // Resetăm starea de editare
        document.getElementById('addOrderForm').reset();
        document.getElementById('addOrderModal').classList.remove('active');
        
        // Resetăm UI-ul la starea de "Adăugare"
        submitBtn.innerHTML = '<i class="fas fa-save"></i> ADAUGĂ COMANDĂ';
        document.getElementById('oImageFile').required = true;
        document.getElementById('oProofFile').required = true;
        imageDropPreview.style.display = 'none';
        imageDropPlaceholder.style.display = 'block';

    } catch (err) {
        console.error(err);
        notify("Eroare: " + err.message, true);
    } finally {
        submitBtn.disabled = false;
        if (!editingOrderId) submitBtn.innerHTML = '<i class="fas fa-save"></i> ADAUGĂ COMANDĂ';
    }
});

// 1. Variabila globală pentru filtru (asigură-te că e definită o singură dată la început)
let activeFilter = "In Curs"; 

// 2. Funcția de schimbare a filtrului
window.setFilter = (status) => {
    activeFilter = status;
    
    // Update vizual butoane: scoatem 'active' de la toate și punem pe cel apăsat
    document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
    
    // Căutăm butonul apăsat și îi dăm clasa active (folosind event.currentTarget sau ID)
    if (event && event.currentTarget) {
        event.currentTarget.classList.add('active');
    }
    
    // Reîncărcăm grila
    loadOrdersRealtime();
};

// 3. Funcția principală (Snapshot în timp real)
function loadOrdersRealtime() {
// This sorts by the calendar date first, then by creation time if dates are identical
const q = query(collection(db, "comenzi"), orderBy("orderDate", "desc"), orderBy("createdAt", "desc"));    
    onSnapshot(q, (snapshot) => {
        ordersGrid.innerHTML = ""; // Curățăm grila
        currentOrders = []; // Resetăm lista locală
        
        // Obiect pentru numărare
let counts = { "In Curs": 0, "Livrat": 0, "Anulat": 0, "Respins": 0 };
        snapshot.forEach((docSnap) => {
            const data = docSnap.data();
            data.id = docSnap.id;
            currentOrders.push(data);

            const status = data.status || "In Curs";

            // Pasul A: Numărăm comanda indiferent de filtru pentru a actualiza etichetele (0)
            if (counts.hasOwnProperty(status)) {
                counts[status]++;
            }

            // Pasul B: AFIȘĂM cardul DOAR dacă se potrivește cu filtrul de sus
            if (status === activeFilter) {
                renderCard(data);
            }
        });

        // Pasul C: Actualizăm textul de pe butoane cu cifrele reale
        updateFilterLabels(counts);
    });
}

function updateFilterLabels(counts) {
    const cursEl = document.getElementById('count-curs');
    const livratEl = document.getElementById('count-livrat');
    const anulatEl = document.getElementById('count-anulat');
    const respinsEl = document.getElementById('count-respins');

    if (cursEl) cursEl.innerText = `(${counts["In Curs"]})`;
    if (livratEl) livratEl.innerText = `(${counts["Livrat"]})`;
    if (anulatEl) anulatEl.innerText = `(${counts["Anulat"]})`;
    if (respinsEl) respinsEl.innerText = `(${counts["Respins"]})`;
}

function renderCard(data) {
    const status = data.status || "In Curs";
    let sClass = "status-in-curs", sIcon = "fa-spinner fa-spin", sText = "În Curs", btnColorClass = "btn-st-curs";
    
    if(status === "Livrat") { 
        sClass = "status-livrat"; sIcon = "fa-truck-fast"; sText = "Livrat"; btnColorClass = "btn-st-livrat";
    } else if(status === "Anulat") { 
        sClass = "status-anulat"; sIcon = "fa-ban"; sText = "Anulat"; btnColorClass = "btn-st-anulat";
    } else if(status === "Respins") {
        sClass = "status-respins"; sIcon = "fa-times-circle"; sText = "Respins"; btnColorClass = "btn-st-respins";
    }

    const adminControls = globalIsAdmin ? `
        <div class="card-controls">
            <button class="control-btn edit-btn" onclick="event.stopPropagation(); openEditModal('${data.id}')"><i class="fas fa-edit"></i></button>
            <button class="control-btn delete-btn" onclick="event.stopPropagation(); deleteOrder('${data.id}')"><i class="fas fa-trash"></i></button>
        </div>` : "";

    const card = document.createElement('div');
    card.className = `order-card ${sClass}`;
    card.innerHTML = `
        ${adminControls}
        <div class="order-img-container">
            <img src="${data.imageUrl}" class="order-img" onclick="openOrderDetails('${data.id}')">
        </div>
        <div class="card-footer">
            <!-- LEFT SIDE: Name + Date -->
            <div class="footer-left-side">
                <span class="footer-name">${data.name}</span>
                <span class="footer-date"><i class="far fa-calendar-alt" style="font-size: 9px; margin-right: 3px;"></i> ${data.orderDate}</span>
            </div>
            
            <!-- CENTER: Price -->
            <div class="footer-center-side" style="flex:1; display:flex; justify-content:center;">
                <span class="footer-price-text">${formatPrice(data.price, data.currency || 'RON')}</span>
            </div>
            
            <!-- RIGHT SIDE: Status -->
            <div class="footer-right-side" style="flex:1; display:flex; justify-content:flex-end; position:relative;">
                <button class="status-picker-trigger ${btnColorClass}" onclick="event.stopPropagation(); ${globalIsAdmin ? `toggleStatusMenu('${data.id}')` : ''}">
                    <i class="fas ${sIcon}"></i> ${sText}
                </button>
                <div class="status-menu" id="menu-${data.id}">
                    <div class="status-option opt-curs" onclick="updateStatus('${data.id}', 'In Curs')"><i class="fas fa-spinner"></i> ÎN CURS</div>
                    <div class="status-option opt-livrat" onclick="updateStatus('${data.id}', 'Livrat')"><i class="fas fa-truck-fast"></i> LIVRAT</div>
                    <div class="status-option opt-anulat" onclick="updateStatus('${data.id}', 'Anulat')"><i class="fas fa-ban"></i> ANULAT</div>
                    <div class="status-option opt-respins" onclick="updateStatus('${data.id}', 'Respins')"><i class="fas fa-times-circle"></i> RESPINS</div>
                </div>
            </div>
        </div>
    `;
    ordersGrid.appendChild(card);
}

if(currentStatus === "In Curs") nextStatus = "Livrat";

          if (isError) {

              toast.style.color = 'var(--admin-red)';
              toast.style.boxShadow = '0 0 25px var(--admin-red-dim)';
              toast.innerHTML = `<i class="fas fa-exclamation-triangle"></i> ${message}`;
          } else {
              toast.innerHTML = `<i class="fas fa-check-circle"></i> ${message}`;
          }
          
          document.body.appendChild(toast);
          setTimeout(() => {
              toast.style.transition = '0.5s';
              toast.style.opacity = '0';
              setTimeout(() => toast.remove(), 500);
          }, 3000);
      }

// Transformă 1000 în 1,000 și adaugă moneda
function formatPrice(amount, currency) {
    const formatted = new Intl.NumberFormat('en-US').format(amount);
    const symbols = { 'RON': 'RON', 'EUR': '€', 'GBP': '£', 'USD': '$' };
    const symbol = symbols[currency] || currency;
    return `${formatted} ${symbol}`;
}

window.formatPrice = (amount, currency) => {
    // Formatează numărul cu virgulă la mii (Ex: 1,000)
    const formattedNumber = new Intl.NumberFormat('en-US').format(amount);
    
    // Mapează codul de monedă la simbol
    const symbols = { 'RON': 'RON', 'EUR': '€', 'GBP': '£', 'USD': '$' };
    const symbol = symbols[currency] || currency;
    
    return `${formattedNumber} ${symbol}`;
};
