<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Comenzi Portrete</title>
  
  <!-- Font: Oswald & FontAwesome for Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    /* --- THEME: Electric Cyan, Deep Space Blue & Admin Red --- */
    :root {
      --bg-dark: #030712;
      --primary: #00f2fe;
      --primary-dim: rgba(0, 242, 254, 0.4); 
      --admin-red: #ff4757;
      --admin-red-dim: rgba(255, 71, 87, 0.4);
      --text-main: #ffffff;
      --glass-bg: rgba(13, 25, 41, 0.7);
      --glass-border: rgba(255, 255, 255, 0.1);
    }

    * { box-sizing: border-box; outline: none; margin: 0; padding: 0; }
    
    body {
      background-color: var(--bg-dark);
      font-family: 'Oswald', sans-serif; 
      color: var(--text-main);
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* --- FLOATING HEADER --- */
    .header-container {
      position: fixed; top: 0; left: 0; right: 0; padding: 20px;
      z-index: 1000; display: flex; justify-content: center;
    }

    header {
      width: 100%; max-width: 1200px; display: flex; align-items: center;
      justify-content: space-between; padding: 10px 20px 10px 30px;
      background: rgba(3, 7, 18, 0.6); border: 1px solid rgba(0, 242, 254, 0.2);
      border-radius: 100px; backdrop-filter: blur(16px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .logo img { height: 40px; vertical-align: middle; }

    /* --- AUTH CONTAINER --- */
    .header-auth-box { display: flex; align-items: center; }

    .cyber-btn {
      background: rgba(0, 242, 254, 0.05); border: 1px solid var(--primary);
      color: var(--primary); padding: 8px 20px; font-family: 'Oswald', sans-serif;
      font-size: 14px; font-weight: 500; text-transform: uppercase;
      letter-spacing: 1px; cursor: pointer; transition: all 0.3s ease;
      display: flex; align-items: center; gap: 8px; border-radius: 50px;
    }

    .cyber-btn:hover { background: var(--primary); color: #000; box-shadow: 0 0 15px var(--primary); }

    .logout-btn { border-color: var(--admin-red); color: var(--admin-red); background: transparent; }
    .logout-btn:hover { background: var(--admin-red); color: #fff; box-shadow: 0 0 15px var(--admin-red-dim); }

    .user-profile-ui { display: none; align-items: center; gap: 15px; }
    .user-avatar { width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--primary); box-shadow: 0 0 10px var(--primary-dim); object-fit: cover; }

    /* --- GLOBAL BACKGROUND --- */
    .cyber-page-section {
        position: relative; min-height: 100vh; display: flex; flex-direction: column;
        align-items: center; justify-content: flex-start; padding-top: 120px; overflow: hidden;
    }

    .bg-grid-engine {
        position: absolute; width: 200%; height: 200%; top: -50%; left: -50%;
        background-image: linear-gradient(rgba(0, 242, 254, 0.1) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 242, 254, 0.1) 1px, transparent 1px);
        background-size: 60px 60px; transform: perspective(600px) rotateX(55deg);
        animation: gridSlowScroll 20s linear infinite;
        mask-image: radial-gradient(circle at center, black 20%, transparent 80%);
        z-index: 0; pointer-events: none;
    }

    .bg-nebula {
        position: absolute; inset: 0;
        background: radial-gradient(circle at 50% 50%, rgba(0, 119, 255, 0.15) 0%, transparent 60%);
        filter: blur(80px); z-index: 0; pointer-events: none;
    }

    @keyframes gridSlowScroll { from { background-position: 0 0; } to { background-position: 0 60px; } }

    /* --- CONTENT CONTAINER --- */
    .container { position: relative; z-index: 5; max-width: 1200px; width: 100%; padding: 20px; margin: 0 auto; text-align: center; }

    .page-main-title {
        font-weight: 700; font-size: clamp(40px, 8vw, 85px); text-transform: uppercase;
        letter-spacing: 2px; margin-bottom: 10px;
        background: linear-gradient(180deg, #ffffff 0%, var(--primary) 100%);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 0 25px var(--primary-dim));
    }

    /* --- WELCOME TEXT & BADGES --- */
    .welcome-container {
        opacity: 0; transition: opacity 0.5s ease; font-size: clamp(18px, 3vw, 24px);
        font-weight: 600; letter-spacing: 1px; color: #ffffff; text-transform: uppercase;
        display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap;
    }

    .badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 50px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
    .badge-admin { background: rgba(255, 71, 87, 0.1); border: 1px solid var(--admin-red); color: var(--admin-red); box-shadow: 0 0 15px var(--admin-red-dim); }
    .badge-user { background: rgba(0, 242, 254, 0.1); border: 1px solid var(--primary); color: var(--primary); box-shadow: 0 0 15px var(--primary-dim); }

    /* --- ADMIN ACTION BAR --- */
    .admin-action-bar {
        display: none;
        margin-top: 30px;
        justify-content: center;
    }

    .btn-admin-add {
        background: rgba(255, 71, 87, 0.1); border: 2px solid var(--admin-red);
        color: #fff; padding: 12px 30px; font-family: 'Oswald', sans-serif;
        font-size: 16px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px;
        border-radius: 50px; cursor: pointer; display: flex; align-items: center;
        gap: 10px; transition: all 0.3s ease; box-shadow: 0 0 20px var(--admin-red-dim);
    }
    .btn-admin-add:hover {
        background: var(--admin-red); color: #fff; transform: translateY(-3px); box-shadow: 0 0 30px var(--admin-red);
    }

    /* --- ORDERS GRID --- */
    .orders-grid {
        display: none; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 30px; margin-top: 50px; padding-bottom: 50px;
    }

    .order-card {
        background: var(--glass-bg); border: 1px solid var(--glass-border);
        border-radius: 16px; overflow: hidden; cursor: pointer;
        transition: all 0.3s ease; position: relative; backdrop-filter: blur(10px);
    }

    .order-card:hover { transform: translateY(-10px); border-color: var(--primary); box-shadow: 0 10px 30px var(--primary-dim); }

    .order-img { width: 100%; height: 250px; object-fit: cover; border-bottom: 2px solid var(--primary); }

    .order-price-tag {
        position: absolute; top: 15px; right: 15px; background: rgba(0, 0, 0, 0.8);
        border: 1px solid #00ff88; color: #00ff88; padding: 5px 15px;
        border-radius: 50px; font-weight: 700; font-size: 16px; box-shadow: 0 0 15px rgba(0, 255, 136, 0.4);
    }

    /* --- MODALS (POPUPS) - REVAMPED SPICY DESIGN --- */
    .custom-modal-overlay {
        position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(15px);
        display: none; justify-content: center; align-items: center; z-index: 2000; padding: 20px;
    }
    .custom-modal-overlay.active { display: flex; }

    /* Fixing the scrollbar issue by separating header and body */
    .custom-modal-card {
        background: rgba(8, 16, 27, 0.95);
        backdrop-filter: blur(35px);
        border: 1px solid var(--primary);
        border-top: 4px solid var(--primary);
        width: 100%; max-width: 850px;
        border-radius: 24px;
        position: relative; 
        box-shadow: 0 0 50px rgba(0, 242, 254, 0.2), inset 0 0 30px rgba(0, 242, 254, 0.1);
        display: flex; flex-direction: column; overflow: hidden; /* Contains the scrollbar */
    }

    .modal-header-container { padding: 30px 40px 10px 40px; position: relative; z-index: 5; }
    
    .modal-body-container { 
        padding: 10px 40px 40px 40px; 
        overflow-y: auto; 
        max-height: calc(90vh - 110px); 
    }

    /* Custom Scrollbar */
    .modal-body-container::-webkit-scrollbar { width: 8px; }
    .modal-body-container::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; box-shadow: 0 0 10px var(--primary); }
    .modal-body-container::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); }

    .close-modal-btn {
        position: absolute; top: 25px; right: 25px;
        background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
        color: #fff; width: 35px; height: 35px; border-radius: 50%;
        font-size: 16px; cursor: pointer; transition: 0.3s;
        display: flex; align-items: center; justify-content: center; z-index: 10;
    }
    .close-modal-btn:hover { background: var(--admin-red); border-color: var(--admin-red); transform: rotate(90deg); box-shadow: 0 0 15px var(--admin-red); }

    .modal-title {
        font-size: 28px; color: #fff; text-transform: uppercase; letter-spacing: 3px;
        margin-bottom: 20px; border-bottom: 1px solid rgba(0, 242, 254, 0.2); padding-bottom: 15px;
        text-align: center; text-shadow: 0 0 20px var(--primary-dim);
    }
    .modal-title i { color: var(--primary); margin-right: 10px; }

    /* --- FORM GRIDS --- */
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    
    .grid-3-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; grid-column: 1 / -1; }
    .grid-5-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; grid-column: 1 / -1; }
    
    @media (max-width: 768px) { 
        .form-grid, .grid-3-row { grid-template-columns: 1fr; } 
        .grid-5-row { grid-template-columns: 1fr 1fr; }
    }

    .form-section-title {
        grid-column: 1 / -1; font-size: 16px; color: #aaa; text-transform: uppercase;
        letter-spacing: 1px; margin-top: 15px; border-left: 3px solid var(--primary); padding-left: 10px;
    }

    .input-group { position: relative; display: flex; flex-direction: column; text-align: left; }
    .input-group label { font-size: 12px; color: var(--primary); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
    
    .input-wrapper { position: relative; }

    /* --- IMAGE DROP AREA --- */
    .image-drop-area {
        grid-column: 1 / -1;
        height: 280px;
        border: 2px dashed var(--primary);
        border-radius: 16px;
        display: flex; align-items: center; justify-content: center; flex-direction: column;
        position: relative; cursor: pointer; overflow: hidden;
        background: rgba(0, 242, 254, 0.05);
        transition: all 0.3s;
        box-shadow: inset 0 0 20px rgba(0, 242, 254, 0.1);
        margin-bottom: 10px;
    }
    .image-drop-area:hover { background: rgba(0, 242, 254, 0.1); box-shadow: inset 0 0 30px rgba(0, 242, 254, 0.3); }
    .image-drop-area input[type="file"] { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; z-index: 5; }
    
    .image-drop-placeholder { text-align: center; color: var(--primary); pointer-events: none; }
    .image-drop-placeholder i { font-size: 50px; margin-bottom: 15px; text-shadow: 0 0 20px var(--primary); }
    .image-drop-placeholder span { font-size: 18px; font-weight: bold; letter-spacing: 2px; display: block; text-transform: uppercase; }
    
    .image-drop-preview {
        position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain;
        display: none; z-index: 2; background: #000;
    }
    
    .image-remove-btn {
        position: absolute; top: 15px; right: 15px; background: var(--admin-red); color: white;
        border: none; border-radius: 50%; width: 40px; height: 40px; font-size: 18px;
        cursor: pointer; z-index: 10; display: none; align-items: center; justify-content: center;
        box-shadow: 0 0 20px var(--admin-red); transition: 0.3s;
    }
    .image-remove-btn:hover { transform: scale(1.15) rotate(90deg); }

    /* --- PERMANENT LIGHT UP INPUTS --- */
    .styled-input {
        width: 100%; 
        background: rgba(0, 242, 254, 0.08); /* Permanent glowing background tint */
        border: 1px solid var(--primary); /* Permanent primary border */
        color: #fff; font-family: 'Oswald', sans-serif; font-size: 15px;
        padding: 14px 14px 14px 45px; border-radius: 50px; 
        transition: all 0.3s ease; 
        box-shadow: 0 0 15px var(--primary-dim), inset 0 2px 5px rgba(0,0,0,0.5); /* Permanent Glow Box Shadow */
    }
    .styled-input:focus {
        background: rgba(0, 242, 254, 0.15);
        box-shadow: 0 0 25px var(--primary), inset 0 2px 10px rgba(0,0,0,0.5);
    }
    
    /* Icons permanently lit up */
    .input-wrapper i {
        position: absolute; left: 18px; top: 50%; transform: translateY(-50%);
        color: var(--primary); /* Permanent cyan */
        text-shadow: 0 0 15px var(--primary); /* Permanent glow */
        font-size: 16px; transition: all 0.3s ease; pointer-events: none;
    }

    /* Small inputs for the 5-row and 3-row elements */
    .compact-input { padding: 12px 12px 12px 35px; font-size: 13px; }
    .grid-5-row .input-wrapper i { left: 13px; font-size: 13px; }

    /* File Upload Input */
    input[type="file"].styled-input { padding: 9px 10px 9px 40px; font-size: 13px; cursor: pointer; }
    input[type="file"]::file-selector-button {
        background: var(--primary); color: #000; border: none; padding: 5px 12px;
        border-radius: 50px; font-family: 'Oswald', sans-serif; font-weight: bold;
        cursor: pointer; margin-right: 10px; transition: 0.3s;
    }
    input[type="file"]::file-selector-button:hover { background: #fff; box-shadow: 0 0 15px var(--primary); }

    /* Button Salvare */
    .btn-submit-order {
        grid-column: 1 / -1;
        background: var(--primary); color: #000; border: none; padding: 18px;
        font-family: 'Oswald', sans-serif; font-size: 20px; font-weight: 700;
        text-transform: uppercase; letter-spacing: 3px; border-radius: 50px;
        cursor: pointer; transition: 0.3s; margin-top: 10px; 
        box-shadow: 0 0 30px var(--primary-dim);
    }
    .btn-submit-order:hover { background: #fff; box-shadow: 0 0 40px var(--primary); transform: translateY(-3px); }
    .btn-submit-order:disabled { background: #555; box-shadow: none; cursor: not-allowed; transform: none; }

    /* Order Details Modal */
    .details-value { 
        background: rgba(0, 242, 254, 0.08); padding: 14px 14px 14px 45px; border-radius: 50px; 
        color: #fff; font-size: 15px; border: 1px solid var(--primary); word-wrap: break-word;
        box-shadow: 0 0 15px var(--primary-dim), inset 0 2px 5px rgba(0,0,0,0.5);
    }
    .proof-link { color: #00ff88; text-decoration: none; font-weight: bold; text-shadow: 0 0 10px rgba(0,255,136,0.5); }
    .proof-link:hover { text-decoration: underline; }


/* Style for the Copy Button */
    .copy-btn {
        position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
        background: rgba(0, 242, 254, 0.1); border: 1px solid var(--primary);
        color: var(--primary); border-radius: 8px; width: 32px; height: 32px;
        display: flex; align-items: center; justify-content: center;
        cursor: pointer; transition: 0.3s; pointer-events: auto; z-index: 10;
    }
    .copy-btn:hover { background: var(--primary); color: #000; box-shadow: 0 0 10px var(--primary); }
    .copy-btn:active { transform: translateY(-50%) scale(0.9); }
    
    /* Small adjustment to make room for the button */
    .details-value { padding-right: 50px !important; }


/* CUSTOM NOTIFICATION SYSTEM */
    .cyber-toast {
        position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
        background: rgba(3, 7, 18, 0.95); border: 1px solid var(--primary);
        color: var(--primary); padding: 12px 30px; border-radius: 50px;
        font-family: 'Oswald', sans-serif; font-weight: 600; text-transform: uppercase;
        letter-spacing: 1px; z-index: 9999; backdrop-filter: blur(10px);
        box-shadow: 0 0 25px var(--primary-dim);
        animation: toastIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        pointer-events: none; display: flex; align-items: center; gap: 10px;
    }
    @keyframes toastIn { from { opacity: 0; bottom: 0; } to { opacity: 1; bottom: 30px; } }
  </style>
</head>
<body>

    <!-- HEADER -->
    <div class="header-container">
        <header>
            <a href="#" class="logo"><img src="https://iili.io/fXvBEiB.png" alt="KSDA Logo"></a>
            <div class="header-auth-box">
                <button id="googleLoginBtn" class="cyber-btn"><i class="fab fa-google"></i> ADMIN LOGIN</button>
                <div id="userProfileUI" class="user-profile-ui">
                    <img id="userAvatarImg" src="" alt="Avatar" class="user-avatar">
                    <button id="logoutBtn" class="cyber-btn logout-btn">LOGOUT</button>
                </div>
            </div>
        </header>
    </div>

    <!-- MAIN PAGE -->
    <main class="cyber-page-section">
        <div class="bg-grid-engine"></div>
        <div class="bg-nebula"></div>

        <div class="container">
            <h1 class="page-main-title">Comenzi Portrete</h1>
            <div id="welcomeContainer" class="welcome-container"></div>

            <!-- ADMIN ACTION BAR -->
            <div id="adminActionBar" class="admin-action-bar">
                <button id="openAddModalBtn" class="btn-admin-add">
                    <i class="fas fa-plus-circle"></i> Adaugă Comandă
                </button>
            </div>

            <!-- ORDERS GRID -->
            <div id="ordersGrid" class="orders-grid"></div>
        </div>
    </main>

    <!-- ==========================================
         1. ADD ORDER MODAL (REVAMPED)
    ========================================== -->
    <div id="addOrderModal" class="custom-modal-overlay">
        <div class="custom-modal-card">
            
            <div class="modal-header-container">
                <button class="close-modal-btn" onclick="document.getElementById('addOrderModal').classList.remove('active')">✕</button>
                <h2 class="modal-title"><i class="fas fa-pencil-ruler"></i> Adaugă Comandă Nouă</h2>
            </div>
            
            <div class="modal-body-container">
                <form id="addOrderForm" class="form-grid">
                    
                    <!-- NEW IMAGE DROP AREA -->
                    <div class="image-drop-area" id="imageDropArea">
                        <input type="file" id="oImageFile" accept="image/*" required>
                        <div class="image-drop-placeholder" id="imageDropPlaceholder">
                            <i class="fas fa-cloud-upload-alt"></i>
                            <span>Încarcă Imaginea Portretului</span>
                        </div>
                        <img id="imageDropPreview" class="image-drop-preview" src="" alt="Preview">
                        <button type="button" id="imageRemoveBtn" class="image-remove-btn"><i class="fas fa-times"></i></button>
                    </div>

                    <!-- 3 ITEMS ON 1 ROW -->
                    <div class="grid-3-row">
                        <div class="input-group">
                            <label>Data Plasării Comenzii</label>
                            <div class="input-wrapper">
                                <input type="date" id="oDate" class="styled-input compact-input" required>
                                <i class="fas fa-calendar-alt"></i>
                            </div>
                        </div>

                        <div class="input-group">
                            <label>Preț (LEI)</label>
                            <div class="input-wrapper">
                                <input type="number" id="oPrice" class="styled-input compact-input" placeholder="Ex: 150" required>
                                <i class="fas fa-money-bill-wave"></i>
                            </div>
                        </div>

                        <div class="input-group">
                            <label>Dovadă Plată</label>
                            <div class="input-wrapper">
<!-- Change this line -->
<input type="file" id="oProofFile" class="styled-input compact-input" accept="image/*" required>                                <i class="fas fa-file-invoice-dollar"></i>
                            </div>
                        </div>
                    </div>

                    <!-- DETALII LIVRARE -->
                    <div class="form-section-title">Detalii de Livrare</div>

                    <div class="input-group">
                        <label>Nume și Prenume</label>
                        <div class="input-wrapper">
                            <input type="text" id="oName" class="styled-input" required>
                            <i class="fas fa-user"></i>
                        </div>
                    </div>

                    <div class="input-group">
                        <label>Nr. Telefon</label>
                        <div class="input-wrapper">
                            <input type="text" id="oPhone" class="styled-input" required>
                            <i class="fas fa-phone"></i>
                        </div>
                    </div>

                    <div class="input-group">
                        <label>Cod Poștal</label>
                        <div class="input-wrapper">
                            <input type="text" id="oZip" class="styled-input" required>
                            <i class="fas fa-mail-bulk"></i>
                        </div>
                    </div>

                    <div class="input-group">
                        <label>Localitate</label>
                        <div class="input-wrapper">
                            <input type="text" id="oCity" class="styled-input" required>
                            <i class="fas fa-city"></i>
                        </div>
                    </div>

                    <div class="input-group">
                        <label>Județ / Sector</label>
                        <div class="input-wrapper">
                            <input type="text" id="oCounty" class="styled-input" required>
                            <i class="fas fa-map-marker-alt"></i>
                        </div>
                    </div>

                    <div class="input-group">
                        <label>Stradă și nr.</label>
                        <div class="input-wrapper">
                            <input type="text" id="oStreet" class="styled-input" required>
                            <i class="fas fa-road"></i>
                        </div>
                    </div>

                    <!-- 5 SMALL OPTIONS ON 1 ROW FOR BUILDING DETAILS -->
                    <div class="grid-5-row">
                        <div class="input-group">
                            <label>Bloc</label>
                            <div class="input-wrapper">
                                <input type="text" id="oBl" class="styled-input compact-input" placeholder="Bl.">
                                <i class="fas fa-building"></i>
                            </div>
                        </div>
                        <div class="input-group">
                            <label>Scara</label>
                            <div class="input-wrapper">
                                <input type="text" id="oSc" class="styled-input compact-input" placeholder="Sc.">
                                <i class="fas fa-list-ol"></i>
                            </div>
                        </div>
                        <div class="input-group">
                            <label>Interfon</label>
                            <div class="input-wrapper">
                                <input type="text" id="oInterfon" class="styled-input compact-input" placeholder="Int.">
                                <i class="fas fa-bell"></i>
                            </div>
                        </div>
                        <div class="input-group">
                            <label>Etaj</label>
                            <div class="input-wrapper">
                                <input type="text" id="oEt" class="styled-input compact-input" placeholder="Et.">
                                <i class="fas fa-layer-group"></i>
                            </div>
                        </div>
                        <div class="input-group">
                            <label>Apart.</label>
                            <div class="input-wrapper">
                                <input type="text" id="oAp" class="styled-input compact-input" placeholder="Ap.">
                                <i class="fas fa-door-closed"></i>
                            </div>
                        </div>
                    </div>

                    <div class="input-group" style="grid-column: 1 / -1;">
                        <label>Repere sau alte informații</label>
                        <div class="input-wrapper">
                            <input type="text" id="oNotes" class="styled-input" placeholder="Ex: Lăsați la recepție...">
                            <i class="fas fa-info-circle"></i>
                        </div>
                    </div>

                    <button type="submit" class="btn-submit-order"><i class="fas fa-save"></i> ADAUGĂ COMANDĂ</button>
                </form>
            </div>
        </div>
    </div>

    <!-- 2. ORDER DETAILS MODAL (Adjusted layout to fix scrollbar consistently) -->
<!-- 2. ORDER DETAILS MODAL (VIEW MODE WITH COPY BUTTONS) -->
    <div id="orderDetailsModal" class="custom-modal-overlay">
        <div class="custom-modal-card">
            <div class="modal-header-container">
                <button class="close-modal-btn" onclick="document.getElementById('orderDetailsModal').classList.remove('active')">✕</button>
                <h2 class="modal-title"><i class="fas fa-box-open"></i> Fișă Comandă</h2>
            </div>
            
            <div class="modal-body-container">
                <div style="text-align: center; margin-bottom: 25px;">
                    <img id="dImage" src="" style="max-width: 100%; max-height: 350px; border-radius: 16px; border: 2px solid var(--primary); box-shadow: 0 0 30px var(--primary-dim);">
                </div>

                <div class="form-grid">
                    <div class="form-section-title">Date Comandă</div>
                    <div class="input-group"><label>Data Plasării</label><div class="input-wrapper"><div class="details-value" id="dDate"></div><i class="fas fa-calendar-alt"></i><div class="copy-btn" onclick="copyValue('dDate')"><i class="far fa-copy"></i></div></div></div>
                    <div class="input-group"><label>Preț (LEI)</label><div class="input-wrapper"><div class="details-value" id="dPrice"></div><i class="fas fa-money-bill-wave"></i><div class="copy-btn" onclick="copyValue('dPrice')"><i class="far fa-copy"></i></div></div></div>
                    
                    <div class="form-section-title">Detalii de Livrare</div>
                    <div class="input-group"><label>Nume și Prenume</label><div class="input-wrapper"><div class="details-value" id="dName"></div><i class="fas fa-user"></i><div class="copy-btn" onclick="copyValue('dName')"><i class="far fa-copy"></i></div></div></div>
                    <div class="input-group"><label>Nr. Telefon</label><div class="input-wrapper"><div class="details-value" id="dPhone"></div><i class="fas fa-phone"></i><div class="copy-btn" onclick="copyValue('dPhone')"><i class="far fa-copy"></i></div></div></div>
                    <div class="input-group"><label>Cod Poștal</label><div class="input-wrapper"><div class="details-value" id="dZip"></div><i class="fas fa-mail-bulk"></i><div class="copy-btn" onclick="copyValue('dZip')"><i class="far fa-copy"></i></div></div></div>
                    <div class="input-group"><label>Localitate</label><div class="input-wrapper"><div class="details-value" id="dCity"></div><i class="fas fa-city"></i><div class="copy-btn" onclick="copyValue('dCity')"><i class="far fa-copy"></i></div></div></div>
                    <div class="input-group"><label>Județ / Sector</label><div class="input-wrapper"><div class="details-value" id="dCounty"></div><i class="fas fa-map-marker-alt"></i><div class="copy-btn" onclick="copyValue('dCounty')"><i class="far fa-copy"></i></div></div></div>
                    <div class="input-group"><label>Stradă și nr.</label><div class="input-wrapper"><div class="details-value" id="dStreet"></div><i class="fas fa-road"></i><div class="copy-btn" onclick="copyValue('dStreet')"><i class="far fa-copy"></i></div></div></div>

                    <!-- 5 SEPARATE BOXES FOR BUILDING -->
                    <div class="grid-5-row">
                        <div class="input-group"><label>Bloc</label><div class="input-wrapper"><div class="details-value compact-input" id="dBl"></div><i class="fas fa-building"></i><div class="copy-btn" onclick="copyValue('dBl')"><i class="far fa-copy"></i></div></div></div>
                        <div class="input-group"><label>Scara</label><div class="input-wrapper"><div class="details-value compact-input" id="dSc"></div><i class="fas fa-list-ol"></i><div class="copy-btn" onclick="copyValue('dSc')"><i class="far fa-copy"></i></div></div></div>
                        <div class="input-group"><label>Int.</label><div class="input-wrapper"><div class="details-value compact-input" id="dInt"></div><i class="fas fa-bell"></i><div class="copy-btn" onclick="copyValue('dInt')"><i class="far fa-copy"></i></div></div></div>
                        <div class="input-group"><label>Etaj</label><div class="input-wrapper"><div class="details-value compact-input" id="dEt"></div><i class="fas fa-layer-group"></i><div class="copy-btn" onclick="copyValue('dEt')"><i class="far fa-copy"></i></div></div></div>
                        <div class="input-group"><label>Ap.</label><div class="input-wrapper"><div class="details-value compact-input" id="dAp"></div><i class="fas fa-door-closed"></i><div class="copy-btn" onclick="copyValue('dAp')"><i class="far fa-copy"></i></div></div></div>
                    </div>

                    <div class="input-group" style="grid-column: 1 / -1;"><label>Repere / Informații</label><div class="input-wrapper"><div class="details-value" id="dNotes"></div><i class="fas fa-info-circle"></i><div class="copy-btn" onclick="copyValue('dNotes')"><i class="far fa-copy"></i></div></div></div>
                    <div class="input-group" style="grid-column: 1 / -1;"><label>Dovadă Plată</label><div class="input-wrapper"><div class="details-value"><a href="#" id="dProof" target="_blank" class="proof-link">Deschide Imaginea</a></div><i class="fas fa-file-invoice-dollar"></i></div></div>
                </div>
            </div>
        </div>
    </div>

    <!-- ==========================================
         FIREBASE INITIALIZATION & LOGIC
    ========================================== -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
      import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-analytics.js";
      import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";
      import { getFirestore, collection, query, where, getDocs, addDoc, onSnapshot, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyBFU90_W3kOJGcWsz30SnJrFHTePmQIW4I",
        authDomain: "comenzi-f208b.firebaseapp.com",
        projectId: "comenzi-f208b",
        storageBucket: "comenzi-f208b.firebasestorage.app",
        messagingSenderId: "783630339221",
        appId: "1:783630339221:web:88464a0fa18d7a069bdf9c",
        measurementId: "G-P2GM4P595R"
      };

const app = initializeApp(firebaseConfig);
      const analytics = getAnalytics(app);
      const auth = getAuth(app);
      const db = getFirestore(app); // We added this back in
      const provider = new GoogleAuthProvider();
      // We deleted the 'storage' line because ImgBB handles the files now

const IMGBB_API_KEY = "a36a2927cd1793f2af0ae3b113086e43";

async function uploadToImgBB(file) {
    const formData = new FormData();
    formData.append("image", file);
    const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
        method: "POST",
        body: formData
    });
    const data = await response.json();
    return data.data.url; 
}

      // UI Elements
      const loginBtn = document.getElementById('googleLoginBtn');
      const logoutBtn = document.getElementById('logoutBtn');
      const userProfileUI = document.getElementById('userProfileUI');
      const userAvatarImg = document.getElementById('userAvatarImg');
      const welcomeContainer = document.getElementById('welcomeContainer');
      const adminActionBar = document.getElementById('adminActionBar');
      const ordersGrid = document.getElementById('ordersGrid');
      
      let globalIsAdmin = false; 

      // Auth Logic
      loginBtn.addEventListener('click', async () => { try { await signInWithPopup(auth, provider); } catch (e) { console.error(e); }});
      logoutBtn.addEventListener('click', () => { signOut(auth); });

      onAuthStateChanged(auth, async (user) => {
          if (user) {
              loginBtn.style.display = 'none';
              userProfileUI.style.display = 'flex';
              userAvatarImg.src = user.photoURL || 'https://i.ibb.co/4pGm9S2/user-placeholder.png';

              // Admin Check
              globalIsAdmin = false;
              try {
const adminQuery = query(collection(db, "admin_emails"), where("email", "==", user.email));
                  const adminSnapshot = await getDocs(adminQuery);
                  globalIsAdmin = !adminSnapshot.empty;
              } catch (error) { console.warn("Blocked by rules or error.", error); }

              let badgeHtml = "";
              let nameStyle = "";

              if (globalIsAdmin) {
                  badgeHtml = `<span class="badge badge-admin"><i class="fas fa-hammer"></i> ADMIN</span>`;
                  nameStyle = "color: #ff4757; text-shadow: 0 0 15px rgba(255, 71, 87, 0.4);";
                  
                  adminActionBar.style.display = 'flex';
                  ordersGrid.style.display = 'grid';
                  loadOrdersRealtime(); 
              } else {
                  badgeHtml = `<span class="badge badge-user"><i class="fas fa-user"></i> MEMBRU</span>`;
                  nameStyle = "color: var(--primary); text-shadow: 0 0 15px var(--primary-dim);";
                  
                  adminActionBar.style.display = 'none';
                  ordersGrid.style.display = 'none';
              }

              welcomeContainer.innerHTML = `BINE AI VENIT, <span style="${nameStyle}">${user.displayName}</span> ${badgeHtml}`;              
              welcomeContainer.style.opacity = '1';

          } else {
              loginBtn.style.display = 'flex';
              userProfileUI.style.display = 'none';
              adminActionBar.style.display = 'none';
              ordersGrid.style.display = 'none';
              welcomeContainer.style.opacity = '0';
              setTimeout(() => { welcomeContainer.innerHTML = ''; }, 500);
          }
      });

      // --- NEW IMAGE PREVIEW LOGIC ---
      const oImageFile = document.getElementById('oImageFile');
      const imageDropPreview = document.getElementById('imageDropPreview');
      const imageRemoveBtn = document.getElementById('imageRemoveBtn');
      const imageDropPlaceholder = document.getElementById('imageDropPlaceholder');

      oImageFile.addEventListener('change', function() {
          const file = this.files[0];
          if (file) {
              const reader = new FileReader();
              reader.onload = function(e) {
                  imageDropPreview.src = e.target.result;
                  imageDropPreview.style.display = 'block';
                  imageRemoveBtn.style.display = 'flex';
                  imageDropPlaceholder.style.display = 'none';
              }
              reader.readAsDataURL(file);
          }
      });

      imageRemoveBtn.addEventListener('click', function(e) {
          e.preventDefault();
          e.stopPropagation(); // Stops it from opening file picker again
          oImageFile.value = ''; // clear input
          imageDropPreview.src = '';
          imageDropPreview.style.display = 'none';
          imageRemoveBtn.style.display = 'none';
          imageDropPlaceholder.style.display = 'block';
      });


      // --- ADD ORDER LOGIC ---
      document.getElementById('openAddModalBtn').onclick = () => {
          document.getElementById('addOrderModal').classList.add('active');
      };

document.getElementById('addOrderForm').addEventListener('submit', async (e) => {
          e.preventDefault();
if (!globalIsAdmin) return notify("Acces restricționat!", true);

          const submitBtn = e.target.querySelector('.btn-submit-order');
          submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> SE GENEREAZĂ LINK-URILE...';
          submitBtn.disabled = true;

          try {
              const imageFile = document.getElementById('oImageFile').files[0];
              const proofFile = document.getElementById('oProofFile').files[0];
              const orderDate = document.getElementById('oDate').value;

              if (!imageFile || !proofFile) {
                  throw new Error("Te rog să asiguri ambele fișiere (poză și dovadă plată).");
              }

              // 1. Transform Portrait into a link via ImgBB
              const imageUrlUploaded = await uploadToImgBB(imageFile);

              submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> SE ÎNCARCĂ DOVADA...';

              // 2. Transform Payment Proof into a link via ImgBB
              const proofUrlUploaded = await uploadToImgBB(proofFile);

              submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> SE SALVEAZĂ ÎN FIRESTORE...';

              // Concatenate building details properly
              const bl = document.getElementById('oBl').value.trim();
              const sc = document.getElementById('oSc').value.trim();
              const inter = document.getElementById('oInterfon').value.trim();
              const et = document.getElementById('oEt').value.trim();
              const ap = document.getElementById('oAp').value.trim();
              
              let bParts = [];
              if(bl) bParts.push(`Bl. ${bl}`);
              if(sc) bParts.push(`Sc. ${sc}`);
              if(inter) bParts.push(`Int. ${inter}`);
              if(et) bParts.push(`Et. ${et}`);
              if(ap) bParts.push(`Ap. ${ap}`);
              const finalBuilding = bParts.length > 0 ? bParts.join(', ') : "La casă (fără bloc)";

              // 3. Salvare in Firestore (Now using the ImgBB links)
              await addDoc(collection(db, "comenzi"), {
                  imageUrl: imageUrlUploaded,
                  paymentProof: proofUrlUploaded,
                  orderDate: orderDate,
                  price: parseFloat(document.getElementById('oPrice').value),
                  name: document.getElementById('oName').value.trim(),
                  phone: document.getElementById('oPhone').value.trim(),
                  zipCode: document.getElementById('oZip').value.trim(),
                  city: document.getElementById('oCity').value.trim(),
                  county: document.getElementById('oCounty').value.trim(),
                  street: document.getElementById('oStreet').value.trim(),
                  building: finalBuilding,
                  notes: document.getElementById('oNotes').value.trim(),
                  createdAt: serverTimestamp(),
                  createdBy: auth.currentUser.email
              });

              document.getElementById('addOrderForm').reset();
              document.getElementById('addOrderModal').classList.remove('active');
              
              // Reset Image Preview box UI manually
              imageDropPreview.src = '';
              imageDropPreview.style.display = 'none';
              imageRemoveBtn.style.display = 'none';
              imageDropPlaceholder.style.display = 'block';

              notify("Comanda a fost adăugată!"); 

          } catch(err) {
              console.error(err);
              notify("Eroare: " + err.message, true); 
          } finally {
              submitBtn.innerHTML = '<i class="fas fa-save"></i> ADAUGĂ COMANDĂ';
              submitBtn.disabled = false;
          }
      });

      // --- RENDER ORDERS REALTIME ---
      let currentOrders = [];
      
      function loadOrdersRealtime() {
          const q = query(collection(db, "comenzi"), orderBy("createdAt", "desc"));
          
          onSnapshot(q, (snapshot) => {
              ordersGrid.innerHTML = ""; 
              currentOrders = []; 
              
              if(snapshot.empty) {
                  ordersGrid.innerHTML = "<p style='grid-column:1/-1; color:#aaa;'>Nu există comenzi momentan.</p>";
                  return;
              }

              snapshot.forEach((doc) => {
                  const data = doc.data();
                  data.id = doc.id;
                  currentOrders.push(data); 

                  const card = document.createElement('div');
                  card.className = 'order-card';
                  card.dataset.id = data.id; 
                  
                  card.innerHTML = `
                      <img src="${data.imageUrl}" alt="Portret" class="order-img" onerror="this.src='https://i.ibb.co/4pGm9S2/user-placeholder.png'">
                      <div class="order-price-tag">${data.price} LEI</div>
                  `;

                  card.onclick = () => openOrderDetails(data.id);
                  
                  ordersGrid.appendChild(card);
              });
          });
      }

window.openOrderDetails = function(orderId) {
          const order = currentOrders.find(o => o.id === orderId);
          if(!order) return;

          document.getElementById('dImage').src = order.imageUrl;
          document.getElementById('dDate').innerText = order.orderDate || "Nesetată";
          document.getElementById('dPrice').innerText = order.price;
          document.getElementById('dProof').href = order.paymentProof;
          document.getElementById('dName').innerText = order.name;
          document.getElementById('dPhone').innerText = order.phone;
          document.getElementById('dZip').innerText = order.zipCode;
          document.getElementById('dCity').innerText = order.city;
          document.getElementById('dCounty').innerText = order.county;
          document.getElementById('dStreet').innerText = order.street;
          document.getElementById('dNotes').innerText = order.notes || "Nicio notiță";

          // Splitting the building string back into 5 parts
          // This looks for "Bl. X", "Sc. X", etc. in your saved string
          const b = order.building || "";
          document.getElementById('dBl').innerText = b.match(/Bl\. ([^,]+)/)?.[1] || "-";
          document.getElementById('dSc').innerText = b.match(/Sc\. ([^,]+)/)?.[1] || "-";
          document.getElementById('dInt').innerText = b.match(/Int\. ([^,]+)/)?.[1] || "-";
          document.getElementById('dEt').innerText = b.match(/Et\. ([^,]+)/)?.[1] || "-";
          document.getElementById('dAp').innerText = b.match(/Ap\. ([^,]+)/)?.[1] || "-";

          document.getElementById('orderDetailsModal').classList.add('active');
      };


// Function to copy text to clipboard
      window.copyValue = function(elementId) {
          const text = document.getElementById(elementId).innerText;
          if (!text || text === "-") return;
          
          navigator.clipboard.writeText(text).then(() => {
              // Optional: change the icon briefly to show it worked
              notify("Copiat în clipboard!"); 
          });
      };


function notify(message, isError = false) {
          const oldToast = document.querySelector('.cyber-toast');
          if (oldToast) oldToast.remove();

          const toast = document.createElement('div');
          toast.className = 'cyber-toast';
          if (isError) {
              toast.style.borderColor = 'var(--admin-red)';
              toast.style.color = 'var(--admin-red)';
              toast.style.boxShadow = '0 0 25px var(--admin-red-dim)';
              toast.innerHTML = `<i class="fas fa-exclamation-triangle"></i> ${message}`;
          } else {
              toast.innerHTML = `<i class="fas fa-check-circle"></i> ${message}`;
          }
          
          document.body.appendChild(toast);
          setTimeout(() => {
              toast.style.transition = '0.5s';
              toast.style.opacity = '0';
              setTimeout(() => toast.remove(), 500);
          }, 3000);
      }
    </script>
</body>
</html>
